name: nhap-bia-50
on:
  push:
    branches: [nhap-bia-50]
    paths: [nhap-bia-50/danh-sach.txt, nhap-bia-50/xu-ly.py]
permissions:
  contents: write
jobs:
  tai-bia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python nhap-bia-50/xu-ly.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add nhap-bia-50/*.webp
          git commit -m "Them 50 bia sach (webp)" || echo "khong co thay doi"
          git push
