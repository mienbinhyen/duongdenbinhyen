<style>

<script>
    // 1. Slider script
    const track = document.getElementById('sliderTrack');
    let index = 0;
    setInterval(() => { index = (index + 1) % 3; track.style.transform = `translateX(-${index * 100}%)`; }, 3000);

    // 2. Form script gửi về Google Sheet
    const pacoForm = document.getElementById('pacoForm');
    pacoForm.addEventListener('submit', e => {
        e.preventDefault();
        document.getElementById('submitBtn').innerHTML = "Đang gửi...";
        fetch("https://script.google.com/macros/s/AKfycbzYGjzAdP4RLsO7uVT85TLPoJtNxDPBBAAXvpmY5WvwETiRFUekWzYsW7R6wS1z7UOx/exec", {
            method: 'POST', mode: 'no-cors', body: new FormData(pacoForm)
        }).then(() => {
            document.getElementById('msg').classList.remove('hidden');
            pacoForm.reset();
            document.getElementById('submitBtn').innerHTML = "HOÀN TẤT ĐẶT HÀNG";
        });
    });

    // 3. Đồng hồ & Bộ đếm đồng bộ
    window.addEventListener('load', function() {
        const clockEl = document.getElementById('paco-clock');
        if (clockEl) {
            setInterval(() => {
                const now = new Date();
                clockEl.textContent = now.toLocaleTimeString('vi-VN', { 
                    timeZone: 'Asia/Ho_Chi_Minh', hour12: false 
                });
            }, 1000);
        }
        const counterEl = document.getElementById('paco-counter');
        if (counterEl) {
            fetch('https://api.counterapi.dev/v1/duongdenbinhyen/paco/up')
                .then(res => res.json())
                .then(data => {
                    counterEl.textContent = (data.count + 100000).toLocaleString('vi-VN');
                })
                .catch(() => { counterEl.textContent = "100.000"; });
        }
    });
</script>
