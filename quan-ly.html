<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Trang quản lý</title>
<style>
:root{--bg:#f3f5f7;--surface:#fff;--raise:#f7f9fb;--line:#e1e6eb;--fg:#17212b;--muted:#5d6b78;--brand:#1f5f8b;--brand2:#174a6d;--soft:#e7f0f7;
--ok:#1d7a4d;--ok-bg:#e5f4ec;--warn:#a65b00;--warn-bg:#fdf1e1;--bad:#b42318;--bad-bg:#fdeceb;--shadow:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.04);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1418;--surface:#171e24;--raise:#1d252c;--line:#2a343d;--fg:#e6ebef;--muted:#9aa8b4;--brand:#6fb1e0;--brand2:#9ccbec;--soft:#1b2d3b;--ok:#5fc791;--ok-bg:#16301f;--warn:#f0ad55;--warn-bg:#3a2a12;--bad:#ff8a80;--bad-bg:#3a1714;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.top .brand{flex:1;min-width:0}.top .brand b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top .brand span{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--brand)}
.chip.staff{background:var(--warn-bg);color:var(--warn)}
@media(max-width:520px){.top .brand span{display:none}#who .chip .r{display:none}}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:38px;height:38px;display:grid;place-items:center;cursor:pointer;font-size:16px;padding:0 10px}
main{max-width:1100px;margin:0 auto;padding:16px 16px 120px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.soft{background:transparent;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:18px}
h1{font-size:21px;margin:0 0 4px;line-height:1.3}h2{font-size:17px;margin:0 0 4px}h3{font-size:15px;margin:0 0 6px}
.muted{color:var(--muted);font-size:13px;margin:0}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.btn{border:0;background:var(--brand);color:#fff;font-weight:600;border-radius:10px;padding:10px 16px;cursor:pointer;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--brand2)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}.btn.ghost:hover{background:var(--raise)}
.btn.ok{background:var(--ok)}.btn.danger{background:var(--bad)}.btn.sm{min-height:34px;padding:6px 12px;font-size:13.5px}.btn.block{width:100%}
.back{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:36px;padding:0 12px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
label{display:block;font-size:13.5px;font-weight:600;margin:12px 0 6px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;outline:none}
textarea{resize:vertical;min-height:80px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--soft)}
input:disabled,textarea:disabled,select:disabled{background:var(--raise);color:var(--muted)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.65;font-style:italic}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:8px 0 0}
.note{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--soft);color:var(--fg);margin:10px 0 0}
.note.warn{background:var(--warn-bg);color:var(--warn)}.note.bad{background:var(--bad-bg);color:var(--bad)}
.big{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;cursor:pointer;margin-bottom:12px;box-shadow:var(--shadow)}
.big:hover{border-color:var(--brand)}.big .bi{flex:0 0 46px;height:46px;border-radius:12px;background:var(--soft);color:var(--brand);display:grid;place-items:center;font-size:21px;font-weight:700}
.big b{display:block;font-size:16.5px}.big small{display:block;font-size:13px;color:var(--muted)}.big .arr{color:var(--muted);font-size:24px}
.big.warnb .bi{background:var(--warn-bg);color:var(--warn)}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:10px}.prog i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}
.hist{list-style:none;margin:8px 0 0;padding:0}.hist li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}.hist li:first-child{border-top:0}
.hist .av{flex:0 0 32px;height:32px;border-radius:50%;background:var(--soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:13px}
.hist b{font-size:14px;font-weight:600;display:block;overflow-wrap:anywhere}.hist small{color:var(--muted);font-size:12px}
.score{flex:0 0 40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.score.g{background:var(--ok-bg);color:var(--ok)}.score.m{background:var(--warn-bg);color:var(--warn)}.score.b{background:var(--bad-bg);color:var(--bad)}.score.n{background:var(--raise);color:var(--muted)}
.plist{list-style:none;margin:0;padding:0}.plist li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer}
.plist li:hover{background:var(--raise)}.plist .t{flex:1;min-width:0}.plist .t b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.plist .t span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
details.grp{border-top:1px solid var(--line)}details.grp>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 2px;cursor:pointer;font-weight:700}
details.grp>summary::-webkit-details-marker{display:none}details.grp>summary span{color:var(--muted);font-weight:500;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chips button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
/* editor */
.ebar{position:sticky;top:59px;z-index:25;background:var(--bg);padding:8px 0 10px;margin:-8px 0 4px}
.ebar .inner{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px;box-shadow:var(--shadow)}
.ebar .fn{flex:1;min-width:0}.ebar .fn b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ebar .fn span{font-size:12px;color:var(--muted)}
.modeline{font-size:12.5px;padding:6px 10px;border-radius:8px;margin-top:8px;display:flex;gap:8px;align-items:center}
.modeline.view{background:var(--soft)}.modeline.edit{background:var(--warn-bg);color:var(--warn)}
.tabs{display:flex;gap:4px;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.tabs .n{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;margin-left:4px}
.ring{--p:0;--c:var(--ok);width:84px;height:84px;border-radius:50%;flex:0 0 84px;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0)}
.ring span{width:66px;height:66px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.ck{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.ck:first-of-type{border-top:0}
.ck .ic{flex:0 0 24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}
.ck.ok .ic{background:var(--ok-bg);color:var(--ok)}.ck.wa .ic{background:var(--warn-bg);color:var(--warn)}.ck.ba .ic{background:var(--bad-bg);color:var(--bad)}
.ck .m{font-size:14px;font-weight:600}.ck .s{font-size:12px;color:var(--muted);margin-top:2px}.ck .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.tb.go{border-color:var(--brand);color:var(--brand)}.tb.fx{background:var(--brand);border-color:var(--brand);color:#fff}
.fld{padding:4px 0 10px}.fld label{display:flex;align-items:center;gap:8px}.fld .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.fld .std{font-size:12px;color:var(--muted);margin:-2px 0 6px}
.tip{font-size:12.5px;margin-top:6px;padding:7px 10px;border-radius:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tip.ok{color:var(--ok);padding-left:0}.tip.wa{background:var(--warn-bg);color:var(--warn)}.tip.ba{background:var(--bad-bg);color:var(--bad)}
.tip .tb{margin-left:auto}
.flash{animation:fl 1.6s ease}@keyframes fl{0%,100%{box-shadow:none}25%{box-shadow:0 0 0 4px var(--brand)}}
.serp{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;background:var(--surface)}
.serp .u{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.serp .ti{color:#1a0dab;font-size:18px;line-height:1.3;margin:2px 0}.serp .de{font-size:13px;color:var(--muted)}
@media (prefers-color-scheme:dark){.serp .ti{color:#8ab4f8}}
.share{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:8px}.share img{width:96px;height:50px;object-fit:cover;border-radius:6px;background:var(--raise)}
.pvwrap{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}.pvwrap>*{min-width:0}
@media(min-width:960px){.pvwrap{grid-template-columns:minmax(0,1fr) 360px;align-items:start}.insp{position:sticky;top:132px;max-height:calc(100vh - 150px);overflow:auto}}
.pvbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pvtool{display:flex;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pvstage{overflow:auto;background:var(--raise);display:flex;justify-content:center}
#pv{border:0;width:100%;height:68vh;background:#fff;display:block}
.pvstage.phone #pv{width:390px;max-width:100%}
.outline{margin:0;padding:0;list-style:none}.outline li{display:flex;align-items:center;gap:8px;padding:8px 2px;border-top:1px solid var(--line);font-size:13.5px}
.outline li:first-child{border-top:0}.outline .lb{flex:1;min-width:0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.outline .num{flex:0 0 22px;height:22px;border-radius:6px;background:var(--raise);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.insp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
@media(max-width:959px){body.drawer main{padding-bottom:58vh}.insp.open{position:fixed;left:0;right:0;bottom:0;z-index:40;border-radius:16px 16px 0 0;max-height:52vh;overflow:auto;box-shadow:0 -8px 30px rgba(0,0,0,.18);padding-bottom:max(14px,env(safe-area-inset-bottom))}}
.crumbs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}.crumbs button{border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:3px 9px;font-size:12px;cursor:pointer}
.crumbs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.acts{display:flex;gap:6px;flex-wrap:wrap}.part{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.part .pl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.imgrow{display:flex;gap:8px;align-items:center}.imgrow img{width:56px;height:56px;object-fit:cover;border-radius:8px;background:var(--raise);flex:0 0 56px}
.diff{font-size:13.5px;line-height:1.6;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:44vh;overflow:auto;overflow-wrap:anywhere}
.diff .f{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-top:8px}.diff .f:first-child{margin-top:0}
del{background:var(--bad-bg);color:var(--bad)}ins{background:var(--ok-bg);color:var(--ok);text-decoration:none}
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:620px;border-radius:18px 18px 0 0;padding:18px 16px max(18px,env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#17212b;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:80;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.busy{position:fixed;inset:0;z-index:90;background:rgba(255,255,255,.55);display:grid;place-items:center;font-weight:600}
@media (prefers-color-scheme:dark){.busy{background:rgba(0,0,0,.5)}}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 8px}@keyframes sp{to{transform:rotate(360deg)}}
.users .u{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.users .u:first-child{border-top:0}
code{background:var(--raise);padding:1px 5px;border-radius:5px;font-size:12.5px}
ol.how{padding-left:20px;margin:6px 0;font-size:13.5px}ol.how li{margin:3px 0}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b id="siteName">Trang quản lý</b><span id="siteSub">Đang tải…</span></div>
  <span id="who" hidden></span>
  <button class="iconbtn" id="btnSettings" title="Cài đặt" aria-label="Cài đặt" hidden>⚙</button>
  <button class="iconbtn" id="btnLogout" title="Đăng xuất" aria-label="Đăng xuất" hidden style="font-size:13px;font-weight:600">Thoát</button>
</header>
<main id="app"><div class="card"><div class="spin"></div><p class="muted" style="text-align:center">Đang tải…</p></div></main>
<div class="sheet-bg" id="sheetBg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<div class="busy" id="busy" hidden><div><div class="spin"></div><span id="busyTxt">Đang xử lý…</span></div></div>
<script>
'use strict';
/* =========================================================
   TRANG QUẢN LÝ – dùng chung cho mọi repo GitHub Pages
   Đặt file này ở thư mục gốc repo. Dữ liệu riêng lưu ở quan-ly-data/
   ========================================================= */
const CFG_PATH='quan-ly-data/cauhinh.json', PEND_DIR='quan-ly-data/cho-duyet/', ITER=310000, NARROW=700;
const S={cfg:null,me:null,K:null,token:null,branch:'main',tree:[],files:[],images:[],pend:[],scan:{},scanDone:0,scanning:false,commits:null,unlocked:{},stack:[],view:null,param:null};
const enc=new TextEncoder(),dec=new TextDecoder();

/* ---------- tiện ích ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escRe=s=>String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const slug=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const norm=s=>slug(s).replace(/-/g,' ');
const has=(t,k)=>!!k&&(' '+norm(t)+' ').includes(' '+norm(k)+' ');
const wc=s=>(String(s||'').match(/\S+/g)||[]).length;
const countKw=(t,k)=>k?((' '+norm(t)+' ').split(' '+norm(k)+' ').length-1):0;
const len=s=>[...String(s||'')].length;
const cut=(s,n)=>len(s)>n?[...s].slice(0,n-1).join('')+'…':(s||'');
const T=s=>String(s||'').replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase());
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const isoNow=()=>{const d=new Date(),o=-d.getTimezoneOffset(),p=n=>String(Math.floor(Math.abs(n))).padStart(2,'0');return today()+'T'+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+(o>=0?'+':'-')+p(o/60)+':'+p(o%60)};
const fmtD=s=>{if(!s)return '';const m=String(s).match(/(\d{4})-(\d{2})-(\d{2})/);return m?m[3]+'/'+m[2]+'/'+m[1]:s};
const fmtT=s=>{const d=new Date(s);return isNaN(d)?'':d.getDate()+'/'+(d.getMonth()+1)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const clsS=s=>s==null?'n':s>=85?'g':s>=65?'m':'b', colS=s=>s>=85?'var(--ok)':s>=65?'var(--warn)':'var(--bad)';
const ico=l=>l==='ok'?'✓':l==='wa'?'!':'✕';
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const sess={get(k){try{return JSON.parse(sessionStorage.getItem(k))}catch(e){return null}},set(k,v){try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function toast(m,ms){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,ms||2800)}
function busy(on,txt){$('busy').hidden=!on;if(txt)$('busyTxt').textContent=txt}
function sheet(html){$('sheet').innerHTML=html;$('sheetBg').hidden=false;const f=$('sheet').querySelector('input,textarea');if(f)setTimeout(()=>f.focus(),50)}
function closeSheet(){$('sheetBg').hidden=true;$('sheet').innerHTML=''}
$('sheetBg').addEventListener('click',e=>{if(e.target.id==='sheetBg')closeSheet()});
function ask(msg,okTxt,danger){return new Promise(r=>{sheet(`<h2>${esc(msg)}</h2><div class="row" style="margin-top:16px"><button class="btn ghost grow" id="aN">Hủy</button><button class="btn ${danger?'danger':''} grow" id="aY">${esc(okTxt||'Đồng ý')}</button></div>`);$('aN').onclick=()=>{closeSheet();r(false)};$('aY').onclick=()=>{closeSheet();r(true)}})}
function prompt2(title,label,type,hint){return new Promise(r=>{sheet(`<h2>${esc(title)}</h2>${hint?`<p class="muted">${hint}</p>`:''}<label for="pV">${esc(label)}</label><input id="pV" type="${type||'text'}" autocomplete="off"><p class="err" id="pE"></p><div class="row" style="margin-top:8px"><button class="btn ghost grow" id="pN">Hủy</button><button class="btn grow" id="pY">Xác nhận</button></div>`);const done=v=>{closeSheet();r(v)};$('pN').onclick=()=>done(null);$('pY').onclick=()=>done($('pV').value);$('pV').onkeydown=e=>{if(e.key==='Enter')done($('pV').value)}})}
function wordDiff(a,b){const A=String(a||'').split(/(\s+)/),B=String(b||'').split(/(\s+)/),n=A.length,m=B.length;if(n*m>600000)return `<del>${esc(cut(a,300))}</del> <ins>${esc(cut(b,300))}</ins>`;const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);let i=0,j=0,o='';while(i<n&&j<m){if(A[i]===B[j]){o+=esc(A[i]);i++;j++}else if(dp[i+1][j]>=dp[i][j+1]){o+='<del>'+esc(A[i++])+'</del>'}else{o+='<ins>'+esc(B[j++])+'</ins>'}}while(i<n)o+='<del>'+esc(A[i++])+'</del>';while(j<m)o+='<ins>'+esc(B[j++])+'</ins>';return o}

const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
const ub64=s=>Uint8Array.from(atob(String(s).replace(/\s/g,'')),c=>c.charCodeAt(0));
const utf8b64=s=>b64(enc.encode(s)), b64utf8=s=>dec.decode(ub64(s));
async function pwKey(pw,salt){const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function rawKey(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt'])}
async function seal(key,u8){const iv=crypto.getRandomValues(new Uint8Array(12));return{iv:b64(iv),ct:b64(new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,u8)))}}
async function unseal(key,o){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},key,ub64(o.ct)))}
async function wrapK(pw,K){const salt=crypto.getRandomValues(new Uint8Array(16));const o=await seal(await pwKey(pw,salt),K);return{salt:b64(salt),iv:o.iv,ct:o.ct}}
async function unwrapK(pw,w){return unseal(await pwKey(pw,ub64(w.salt)),w)}
const pwOk=p=>p.length>=10&&/[a-zA-Z]/.test(p)&&/\d/.test(p);

function ghMsg(st,m){if(st===401)return 'Chìa khóa GitHub sai hoặc đã hết hạn.';if(st===403)return 'Chìa khóa không có quyền ghi vào repo này (hoặc GitHub tạm giới hạn).';if(st===404)return 'Không tìm thấy trên GitHub.';if(st===409||st===422)return 'Có người vừa lưu cùng lúc, vui lòng thử lại.';return 'Lỗi GitHub ('+st+'): '+(m||'')}
async function gh(path,opt={},tok){const h={Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',Authorization:'Bearer '+(tok||S.token)};if(opt.body)h['Content-Type']='application/json';let r;try{r=await fetch('https://api.github.com'+path,{...opt,headers:h,cache:'no-store'})}catch(e){const er=new Error('Không kết nối được GitHub. Kiểm tra mạng.');er.status=0;throw er}if(r.status===204)return null;const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(ghMsg(r.status,j.message));e.status=r.status;throw e}return j}
const RP=()=>`/repos/${S.cfg.repo.owner}/${S.cfg.repo.name}`;
const encPath=p=>String(p).split('/').map(encodeURIComponent).join('/');
async function ghFile(path,ref,raw){const j=await gh(`${RP()}/contents/${encPath(path)}?ref=${encodeURIComponent(ref||S.branch)}`);let c=j.content;if((!c||c==='')&&j.size>0){c=(await gh(`${RP()}/git/blobs/${j.sha}`)).content}return{sha:j.sha,b64:String(c||'').replace(/\s/g,''),text:raw?null:b64utf8(c||'')}}
async function ghTry(path,ref){try{return await ghFile(path,ref)}catch(e){if(e.status===404)return null;throw e}}
async function commit(changes,message){for(let a=0;a<3;a++){const ref=await gh(`${RP()}/git/ref/heads/${encodeURIComponent(S.branch)}`);const head=ref.object.sha;const c=await gh(`${RP()}/git/commits/${head}`);const tree=[];for(const ch of changes){if(ch.del)tree.push({path:ch.path,mode:'100644',type:'blob',sha:null});else if(ch.b64!=null){const b=await gh(`${RP()}/git/blobs`,{method:'POST',body:JSON.stringify({content:ch.b64,encoding:'base64'})});tree.push({path:ch.path,mode:'100644',type:'blob',sha:b.sha})}else tree.push({path:ch.path,mode:'100644',type:'blob',content:ch.text})}const t=await gh(`${RP()}/git/trees`,{method:'POST',body:JSON.stringify({base_tree:c.tree.sha,tree})});const nc=await gh(`${RP()}/git/commits`,{method:'POST',body:JSON.stringify({message,tree:t.sha,parents:[head]})});try{await gh(`${RP()}/git/refs/heads/${encodeURIComponent(S.branch)}`,{method:'PATCH',body:JSON.stringify({sha:nc.sha})});S.commits=null;return nc}catch(e){if(!(e.status===422||e.status===409)||a===2)throw e}}}
const SYS=p=>p===selfPath()||p.startsWith('quan-ly-data/')||/(^|\/)google[0-9a-f]{8,}\.html$/i.test(p)||/(^|\/)(node_modules|\.github|vendor)\//.test(p)||/^_/.test(p);
async function loadTree(){const t=await gh(`${RP()}/git/trees/${encodeURIComponent(S.branch)}?recursive=1`);S.tree=t.tree.filter(x=>x.type==='blob');S.paths=new Set(S.tree.map(x=>x.path));S.files=S.tree.filter(x=>/\.html?$/i.test(x.path)&&!SYS(x.path)).map(x=>({path:x.path,sha:x.sha}));S.images=S.tree.filter(x=>/\.(jpe?g|png|webp|gif|svg|avif)$/i.test(x.path)).map(x=>x.path);S.pend=S.tree.filter(x=>x.path.startsWith(PEND_DIR)&&x.path.endsWith('.json')).map(x=>x.path).sort().reverse()}
const shaOf=p=>(S.tree.find(x=>x.path===p)||{}).sha;

/* ---------- địa chỉ ---------- */
function siteBase(){return S.cfg.site.replace(/\/?$/,'/')}
function sitePathPrefix(){try{return new URL(siteBase()).pathname}catch(e){return '/'}}
function selfPath(){if(!S.cfg)return 'quan-ly.html';const pre=sitePathPrefix();let p=decodeURIComponent(location.pathname);if(p.startsWith(pre))p=p.slice(pre.length);return p||'index.html'}
function pageUrl(p){if(/(^|\/)index\.html?$/i.test(p))return siteBase()+p.replace(/index\.html?$/i,'');return siteBase()+encPath(p)}
function relFromAdmin(p){const pre=sitePathPrefix();const here=decodeURIComponent(location.pathname);const dir=here.slice(0,here.lastIndexOf('/')+1);return (location.origin+pre+encPath(p))}
function urlToPath(href,fromPath){try{const u=new URL(href,pageUrl(fromPath));const b=new URL(siteBase());const hosts=[b.host,location.host];if(!hosts.includes(u.host))return null;let p=decodeURIComponent(u.pathname);const pre=b.pathname;if(p.startsWith(pre))p=p.slice(pre.length);else if(u.host===location.host&&p.startsWith('/'))p=p.slice(1);else return null;if(p===''||p.endsWith('/'))p+='index.html';return p}catch(e){return null}}

function scanKey(){return 'ql:scan2:'+S.cfg.repo.owner+'/'+S.cfg.repo.name}
async function scanAll(){if(S.scanning)return;S.scanning=true;S.scan=store.get(scanKey())||{};const todo=S.files.filter(f=>!S.scan[f.path]||S.scan[f.path].sha!==f.sha);S.scanDone=S.files.length-todo.length;let i=0;updScan();
 const one=async f=>{let txt=null;try{const r=await fetch(relFromAdmin(f.path)+'?v='+f.sha.slice(0,10),{cache:'force-cache'});if(r.ok)txt=await r.text()}catch(e){}if(txt==null){try{txt=(await ghFile(f.path)).text}catch(e){}}if(txt!=null){const a=analyze(txt,f.path);const old=S.scan[f.path]||{};S.scan[f.path]={sha:f.sha,t:a.redirect?'Trang chuyển hướng → '+a.redirect:a.h.title,s:a.score,r:a.redirect?1:0,d:a.h.modified,w:old.sha===f.sha?old.w:undefined}}S.scanDone++;if(S.scanDone%8===0)updScan()};
 await Promise.all(Array.from({length:6},async()=>{while(i<todo.length)await one(todo[i++])}));
 for(const k of Object.keys(S.scan))if(!S.files.some(f=>f.path===k))delete S.scan[k];store.set(scanKey(),S.scan);S.scanning=false;updScan();measureAll()}
async function measureAll(){if(S.measuring)return;S.measuring=true;try{for(const f of S.files.slice()){if(!S.me)break;const sc=S.scan[f.path];if(!sc||sc.sha!==f.sha||sc.w!=null)continue;let txt=null;try{const r=await fetch(relFromAdmin(f.path)+'?v='+f.sha.slice(0,10),{cache:'force-cache'});if(r.ok)txt=await r.text()}catch(e){}if(txt==null)continue;const w=await measureWidth(txt,f.path);if(S.scan[f.path]&&S.scan[f.path].sha===f.sha){S.scan[f.path].w=w;store.set(scanKey(),S.scan);if(w&&w<NARROW&&S.view==='list')renderListRows()}}}finally{S.measuring=false}}
function updScan(){const p=$('scanBar');if(p){p.style.width=(S.files.length?S.scanDone/S.files.length*100:100)+'%';const t=$('scanTxt');if(t)t.textContent=S.scanning?`Đang chấm điểm ${S.scanDone}/${S.files.length} trang…`:`${S.files.length} trang · điểm SEO trung bình ${avgScore()}`}if(S.view==='list')renderListRows()}
function avgScore(){const v=S.files.map(f=>(S.scan[f.path]||{}).s).filter(x=>x!=null);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):'–'}

/* ---------- khổ trang (khóa trang hẹp) ---------- */
function measureWidth(html,path){return new Promise(res=>{const fr=document.createElement('iframe');fr.setAttribute('sandbox','allow-scripts');fr.style.cssText='position:fixed;left:-20000px;top:0;width:1280px;height:900px;border:0;visibility:hidden';fr.setAttribute('aria-hidden','true');const probe=`<script>(function(){function m(){var mx=0;document.querySelectorAll('p,h1,h2,h3,li,img,section,article').forEach(function(e){if(e.closest('header,footer,nav'))return;var s=getComputedStyle(e);if(s.position==='fixed')return;var r=e.getBoundingClientRect();if(r.height<5)return;if(r.width>mx)mx=r.width});parent.postMessage({qlw:Math.round(mx)},'*')}if(document.readyState==='complete')setTimeout(m,400);else addEventListener('load',function(){setTimeout(m,400)})})();<\/script>`;let src=injectHead(html,`<meta http-equiv="Content-Security-Policy" content="img-src data:; media-src 'none'; frame-src 'none'; font-src 'none'"><base href="${esc(pageUrl(path))}">`);src=src.replace(/<\/body>(?![\s\S]*<\/body>)/i,probe+'</body>');if(src.indexOf(probe)<0)src+=probe;const done=w=>{removeEventListener('message',on);clearTimeout(to);fr.remove();res(w)};const on=e=>{if(e.source===fr.contentWindow&&e.data&&typeof e.data.qlw==='number')done(e.data.qlw)};addEventListener('message',on);const to=setTimeout(()=>done(0),9000);fr.srcdoc=src;document.body.appendChild(fr)})}
function isLocked(path){const o=(S.cfg.locks||{})[path];if(o===true)return true;if(o===false)return false;const w=(S.scan[path]||{}).w;return !!w&&w<NARROW}

const sessKey=()=>'ql:sess:'+location.pathname;
async function boot(){let cfg=null;try{const r=await fetch(CFG_PATH+'?t='+Date.now(),{cache:'no-store'});if(r.ok)cfg=await r.json()}catch(e){}
 if(!cfg){S.view='setup';render();return}
 S.cfg=cfg;S.branch=cfg.repo.branch||'main';const s=sess.get(sessKey());
 if(s&&s.u){const u=cfg.users.find(x=>x.u===s.u&&x.active!==false);if(u){S.me=u;S.K=ub64(s.K);S.token=s.tok;try{await afterLogin();return}catch(e){}}}
 S.view='login';render()}
async function afterLogin(){busy(true,'Đang đọc repo…');try{const fresh=await ghTry(CFG_PATH);if(fresh){S.cfg=JSON.parse(fresh.text);S.cfgSha=fresh.sha;const u=S.cfg.users.find(x=>x.u===S.me.u);if(!u||u.active===false){throw new Error('Tài khoản đã bị khóa.')}S.me=u}await loadTree()}finally{busy(false)}S.scan=store.get(scanKey())||{};S.stack=[];S.view='home';render();scanAll()}

 $('lf').onsubmit=async e=>{e.preventDefault();const u=S.cfg.users.find(x=>x.u===$('lu').value.trim().toLowerCase());$('le').textContent='';if(!u){$('le').textContent='Sai tên đăng nhập hoặc mật khẩu.';return}if(u.active===false){$('le').textContent='Tài khoản này đã bị khóa.';return}$('lb').disabled=true;$('lb').textContent='Đang kiểm tra…';
  try{const K=await unwrapK($('lp').value,u);const tok=dec.decode(await unseal(await rawKey(K),S.cfg.token));S.me=u;S.K=K;S.token=tok;sess.set(sessKey(),{u:u.u,K:b64(K),tok});await afterLogin()}catch(err){$('le').textContent=err.status!=null?err.message:(err.message==='Tài khoản đã bị khóa.'?err.message:'Sai tên đăng nhập hoặc mật khẩu.');$('lb').disabled=false;$('lb').textContent='Đăng nhập'}}}

function vSetup(){$('siteName').textContent='Cài đặt trang quản lý';$('siteSub').textContent='Làm 1 lần duy nhất';
 $('app').innerHTML=`<div class="card" style="max-width:560px;margin:8px auto"><h1>Cài đặt lần đầu</h1><p class="muted">Chỉ làm 1 lần. Xong là dùng được mãi.</p>
<h3 style="margin-top:16px">1. Chìa khóa GitHub</h3>
<ol class="how"><li>Mở <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">trang tạo chìa khóa GitHub</a>.</li><li>Đặt tên tùy ý, <b>Expiration</b>: chọn dài nhất.</li><li><b>Repository access</b>: chọn <i>Only select repositories</i> → chọn repo của trang web này.</li><li><b>Permissions → Contents</b>: chọn <i>Read and write</i>.</li><li>Bấm <b>Generate token</b>, chép mã rồi dán vào đây.</li></ol>

<p class="err" id="sE"></p><button class="btn block" id="sB">Lưu cài đặt</button></div>`;
 let found=null;
 let tkT=0;$('sT').oninput=()=>{clearTimeout(tkT);if($('sT').value.trim().length>30)tkT=setTimeout(()=>$('sT').onchange(),600)};
 $('sT').onchange=async()=>{const tok=$('sT').value.trim();$('sRepo').innerHTML='<p class="muted">Đang tìm repo…</p>';found=null;try{found=await detectRepo(tok);$('sRepo').innerHTML=found.list.length>1||!found.match?`<label for="sR">Repo của trang web</label><select id="sR">${found.list.map(r=>`<option value="${esc(r.full_name)}" ${found.match&&found.match.full_name===r.full_name?'selected':''}>${esc(r.full_name)}</option>`).join('')}</select>${found.match?'<p class="muted">✓ Đã tự nhận ra repo theo tên miền.</p>':'<p class="note warn">Không tự nhận ra repo theo tên miền – chọn đúng repo.</p>'}`:`<p class="note">✓ Repo: <b>${esc(found.match.full_name)}</b> (tự nhận theo tên miền)</p>`}catch(e){$('sRepo').innerHTML=`<p class="note bad">${esc(e.message)}</p>`}};
 $('sB').onclick=async()=>{const E_=m=>{$('sE').textContent=m};const tok=$('sT').value.trim(),n=$('sN').value.trim(),u=$('sU').value.trim().toLowerCase(),p=$('sP').value,l=$('sL').value;
  if(!found)return E_('Dán chìa khóa GitHub trước.');if(!n||!u)return E_('Nhập tên hiển thị và tên đăng nhập.');if(!/^[a-z0-9._-]{3,30}$/.test(u))return E_('Tên đăng nhập chỉ dùng chữ thường không dấu, số, dấu chấm/gạch (3–30 ký tự).');if(!pwOk(p))return E_('Mật khẩu cần ít nhất 10 ký tự, có cả chữ và số.');if(p!==$('sP2').value)return E_('Hai lần nhập mật khẩu không khớp.');if(!pwOk(l))return E_('Mật khẩu mở khóa cũng cần ít nhất 10 ký tự, có chữ và số.');if(l===p)return E_('Mật khẩu mở khóa nên khác mật khẩu đăng nhập.');
  const full=($('sR')&&$('sR').value)||found.match.full_name;const repo=found.list.find(r=>r.full_name===full);
  busy(true,'Đang lưu cài đặt…');try{
   const [owner,name]=full.split('/');const info=await gh(`/repos/${owner}/${name}`,{},tok);if(info.permissions&&!info.permissions.push)throw new Error('Chìa khóa chưa có quyền ghi (Contents: Read and write).');
   let site=repo.site||`https://${owner.toLowerCase()}.github.io/${name}/`;const K=crypto.getRandomValues(new Uint8Array(32));const kk=await rawKey(K);const lsalt=crypto.getRandomValues(new Uint8Array(16));
   const cfg={v:1,repo:{owner,name,branch:info.default_branch||'main'},site,siteName:'',token:await seal(kk,enc.encode(tok)),lock:{salt:b64(lsalt),...(await seal(await pwKey(l,lsalt),enc.encode('ok')))},users:[{u,name:n,role:'admin',active:true,...(await wrapK(p,K))}],locks:{},kw:{},created:isoNow()};
   S.cfg=cfg;S.token=tok;S.branch=cfg.repo.branch;try{const idx=await ghTry('index.html');if(idx){const m=idx.text.match(/<meta[^>]+property=["']og:site_name["'][^>]*content=["']([^"']+)/i)||idx.text.match(/<title[^>]*>([^<|–-]+)/i);if(m)cfg.siteName=m[1].trim()}}catch(e){}
   const ex=await ghTry(CFG_PATH);if(ex)throw new Error('Repo này đã được cài đặt rồi. Tải lại trang để đăng nhập.');
   await commit([{path:CFG_PATH,text:JSON.stringify(cfg,null,1)}],'QL · Cài đặt trang quản lý');S.me=cfg.users[0];S.K=K;sess.set(sessKey(),{u,K:b64(K),tok});busy(false);toast('Đã cài đặt xong');await afterLogin()}catch(e){busy(false);E_(e.message)}}}
async function detectRepo(tok){await gh('/user',{},tok);const list=[];for(let p=1;p<=5;p++){const r=await gh(`/user/repos?per_page=100&page=${p}&sort=updated`,{},tok);list.push(...r);if(r.length<100)break}if(!list.length)throw new Error('Chìa khóa chưa được cấp quyền repo nào.');const host=location.hostname.toLowerCase();let match=null;
 for(const r of list){const [o,n]=r.full_name.split('/');let site=`https://${o.toLowerCase()}.github.io/${n.toLowerCase()===o.toLowerCase()+'.github.io'?'':n+'/'}`;try{const c=await gh(`/repos/${o}/${n}/contents/CNAME`,{},tok);const cn=b64utf8(c.content).trim().toLowerCase();if(cn)site='https://'+cn+'/'}catch(e){}r.site=site;const sh=new URL(site).host;if(!match&&(sh===host||sh==='www.'+host||'www.'+sh===host)){if(sh.endsWith('github.io')){if(location.pathname.toLowerCase().startsWith(new URL(site).pathname.toLowerCase()))match=r}else match=r}if(match&&list.length>20)break}
 return{list,match}}

 updScan();$('gEdit').onclick=()=>go('list');$('gNew').onclick=()=>go('newp');if($('gPend'))$('gPend').onclick=()=>go('pending');$('hRef').onclick=()=>{S.commits=null;loadHist(15)};loadHist(15)}
const whoOf=c=>{const m=c.commit.message.match(/^QL · (.+?)(?: gửi chờ duyệt)?:/);return m?m[1]:(c.commit.author&&c.commit.author.name)||'?'};
const msgOf=c=>c.commit.message.split('\n')[0].replace(/^QL · (.+?):\s*/,'');
async function loadHist(n){const ul=$('hist');if(!ul)return;try{if(!S.commits||S.commits.length<n)S.commits=await gh(`${RP()}/commits?sha=${encodeURIComponent(S.branch)}&per_page=${n}`);if(!$('hist'))return;ul.innerHTML=S.commits.slice(0,n).map((c,i)=>`<li data-c="${i}"><span class="av">${esc(whoOf(c)[0]||'?')}</span><span class="grow"><b>${esc(cut(msgOf(c),110))}</b><small>${esc(whoOf(c))} · ${fmtT(c.commit.author.date)}</small></span></li>`).join('')||'<li class="muted">Chưa có.</li>';$('histMore').innerHTML=S.commits.length>=n&&n<100?`<button class="tb" id="hMore" style="margin-top:8px">Xem thêm</button>`:'';if($('hMore'))$('hMore').onclick=()=>loadHist(n+30);ul.querySelectorAll('[data-c]').forEach(li=>li.onclick=()=>histDetail(S.commits[+li.dataset.c]))}catch(e){ul.innerHTML=`<li class="muted">${esc(e.message)}</li>`}}
async function histDetail(c){sheet(`<div class="spin"></div>`);let d;try{d=await gh(`${RP()}/commits/${c.sha}`)}catch(e){sheet(`<p class="err">${esc(e.message)}</p>`);return}const files=(d.files||[]).filter(f=>!f.filename.startsWith('quan-ly-data/'));const st={added:'Thêm mới',modified:'Sửa',removed:'Xóa',renamed:'Đổi tên'};
 sheet(`<h2>${esc(msgOf(c))}</h2><p class="muted">${esc(whoOf(c))} · ${fmtT(c.commit.author.date)}</p><ul class="hist">${files.map(f=>`<li style="cursor:default"><span class="grow"><b>${esc(f.filename)}</b><small>${st[f.status]||f.status}</small></span>${/\.html?$/.test(f.filename)&&f.status!=='removed'?`<a class="tb" href="${esc(pageUrl(f.filename))}" target="_blank" rel="noopener">Xem ↗</a>`:''}</li>`).join('')||'<li class="muted">Chỉ đổi dữ liệu trang quản lý.</li>'}</ul>
 ${S.me.role==='admin'&&files.length&&d.parents&&d.parents.length?`<p class="note warn">Khôi phục = đưa các file trên về đúng như trước lần sửa này.</p><div class="row" style="margin-top:12px"><button class="btn ghost grow" id="hC">Đóng</button><button class="btn danger grow" id="hR">Khôi phục bản trước</button></div>`:`<button class="btn ghost block" id="hC" style="margin-top:12px">Đóng</button>`}`);
 $('hC').onclick=closeSheet;if($('hR'))$('hR').onclick=async()=>{closeSheet();busy(true,'Đang khôi phục…');try{const par=d.parents[0].sha,ch=[];for(const f of files){if(f.status==='added'){if(S.paths.has(f.filename))ch.push({path:f.filename,del:true})}else{const src=f.status==='renamed'?f.previous_filename:f.filename;const o=await ghFile(src,par,true);ch.push({path:src,b64:o.b64});if(f.status==='renamed'&&S.paths.has(f.filename))ch.push({path:f.filename,del:true})}}await commit(ch,`QL · ${S.me.name}: Khôi phục bản trước lần “${cut(msgOf(c),60)}”`);await loadTree();busy(false);toast('Đã khôi phục. Web cập nhật sau khoảng 1 phút.');if(S.view==='home')vHome();scanAll()}catch(e){busy(false);toast(e.message,5000)}}}

 ${ba.length?`<div class="card"><h3 style="color:var(--bad)">Phải sửa</h3>${ba.map(item).join('')}</div>`:''}${wa.length?`<div class="card"><h3 style="color:var(--warn)">Nên sửa</h3>${wa.map(item).join('')}</div>`:''}

async function goCheck(c){if(!(await ensureEdit()))return;const g=c.go;if(g.f){setTab('google');const w=$('w_'+g.f),el=$('f_'+g.f);if(w){w.scrollIntoView({block:'center',behavior:'smooth'});w.classList.remove('flash');void w.offsetWidth;w.classList.add('flash')}if(el)setTimeout(()=>{el.focus({preventScroll:true});if(g.end&&el.setSelectionRange)el.setSelectionRange(el.value.length,el.value.length)},350);return}
 if(g.ld!=null){setTab('google');const d=$('w_ld'+g.ld);if(d){d.open=true;d.scrollIntoView({block:'center'})}return}
 setTab('body');if(!E.doc)return;let el=g.el&&E.doc.contains(g.el)?g.el:null;if(!el&&g.top){el=E.doc.querySelector('h1')||firstLeaf(contentRoot(E.doc))}if(!el&&g.end){const ls=[...E.doc.body.querySelectorAll('p')].filter(p=>!p.closest('header,nav,footer'));el=ls[ls.length-1]}if(!el)return;

function listName(l){if(l._n)return l._n;const d=l.parent.ownerDocument;const w=d.createTreeWalker(d.body,NodeFilter.SHOW_ELEMENT);w.currentNode=l.parent;let t='',n=0,x;const sec=l.parent.closest('section,article');if(sec&&sec!==d.body){const hs=[...sec.querySelectorAll('h2,h3,h4,[class*="title"]')].filter(h=>!l.parent.contains(h)&&(h.compareDocumentPosition(l.parent)&4)&&!E.lists.some(L=>L.items.length>1&&L.items.some(it=>it.contains(h))));const h=hs.find(h=>{const v=h.textContent.trim();return v&&len(v)<90});if(h)t=h.textContent.replace(/\s+/g,' ').trim()}while(!t&&n<120&&(x=w.previousNode())){n++;if(l.parent.contains(x))continue;if(E.lists.some(L=>L.items.length>1&&L.items.some(it=>it.contains(x))))continue;if(/^H[2-5]$/.test(x.tagName)||(/title|heading|tieu-de/i.test(typeof x.className==='string'?x.className:'')&&x.children.length<=2)){const v=x.textContent.replace(/\s+/g,' ').trim();if(v&&len(v)<90)t=v}}if(!t){const h=l.parent.closest('section,article,div')&&l.parent.closest('section,article,div').querySelector('h2,h3,h4');if(h&&!l.parent.contains(h))t=h.textContent.trim()}const it=l.items[0];const smp=l.items.slice(0,4);const kind=smp.every(x=>/\d[\d.,]*\s?(đ|₫|vnđ|vnd)\b/i.test(x.textContent))?'sản phẩm':smp.every(x=>x.querySelector('img')&&x.querySelector('a[href*=".htm"],a[href$="/"]'))||(x=>x.tagName==='A'&&/\.htm/.test(x.getAttribute('href')||''))(it)&&it.querySelector('img')?'bài':it.tagName==='TR'?'hàng':it.querySelector('img')&&it.querySelector('a')?'thẻ':it.tagName==='LI'?'dòng':'mục';l._n={name:cut(t.replace(/\s+/g,' '),42)||'Danh sách',kind,eg:cut(labelOf(it,32),32)};return l._n}

 <div class="diff" style="margin-top:12px">${(ch.items||[]).map(c=>`<div class="f">${esc(c.lbl)}</div>${wordDiff(c.a,c.b)}`).join('')}${(ch.txt||[]).map(c=>`<div class="f">Nội dung</div>${c.a&&c.b?wordDiff(c.a,c.b):c.a?`<del>${esc(c.a)}</del>`:`<ins>${esc(c.b)}</ins>`}`).join('')||''}${(x.images||[]).map(m=>`<div class="f">Ảnh mới</div><ins>${esc(m.path)}</ins>`).join('')}</div>
 <div class="row" style="margin-top:12px"><button class="btn danger grow" id="rN">Từ chối</button><button class="btn ok grow" id="rY">Duyệt & đăng</button></div></div>
 <div class="pvbox"><div class="pvtool"><b>Bản xem trước</b></div><div class="pvstage"><iframe id="rpv" sandbox="allow-same-origin" style="border:0;width:100%;height:70vh;background:#fff"></iframe></div></div>`;
 const fr=$('rpv');fr.srcdoc=injectHead(x.html,`<base href="${esc(pageUrl(x.path))}">`);fr.onload=()=>{try{fr.contentDocument.addEventListener('click',e=>e.preventDefault(),true)}catch(e){}};
 $('rN').onclick=async()=>{if(!(await ask('Từ chối bài này? Bài sẽ bị xóa khỏi hàng chờ.','Từ chối',true)))return;busy(true,'Đang xử lý…');try{await commit([{path:x._p,del:true}],`QL · ${S.me.name}: Từ chối bài của ${x.who} – ${x.path}`);await loadTree();busy(false);toast('Đã từ chối');S.stack=[];S.view='home';render()}catch(e){busy(false);toast(e.message,5000)}};
 $('rY').onclick=async()=>{busy(true,'Đang đăng…');try{const cur=await ghTry(x.path);if(x.isNew&&cur){busy(false);toast('Đã có trang trùng tên file – không duyệt được.',5000);return}if(!x.isNew&&cur&&cur.sha!==x.baseSha){busy(false);if(!(await ask('Trang này đã thay đổi sau khi nhân viên gửi. Duyệt sẽ ghi đè bản hiện tại.','Vẫn duyệt',true)))return;busy(true,'Đang đăng…')}
  const html=touchDates(x.html,x.isNew);const c=[{path:x.path,text:html},{path:x._p,del:true}];(x.images||[]).forEach(m=>c.push({path:m.path,b64:m.b64}));if(S.paths.has('sitemap.xml')){const sx=await ghFile('sitemap.xml');const nx=sitemapTouch(sx.text,pageUrl(x.path));if(nx!==sx.text)c.push({path:'sitemap.xml',text:nx})}if(x.kw){const f=await ghTry(CFG_PATH);const cf=f?JSON.parse(f.text):S.cfg;cf.kw=cf.kw||{};if(cf.kw[x.path]!==x.kw){cf.kw[x.path]=x.kw;c.push({path:CFG_PATH,text:JSON.stringify(cf,null,1)});S.cfg.kw=cf.kw}}
  await commit(c,`QL · ${S.me.name}: Duyệt bài của ${x.who}: ${x.summary} – ${x.path}`);await loadTree();busy(false);toast('Đã duyệt. Web cập nhật sau khoảng 1 phút.',4000);S.stack=[];S.view='home';render();scanAll()}catch(e){busy(false);toast(e.message,6000)}}}

/* ---------- CÀI ĐẶT ---------- */
function vSettings(){const me=S.me,c=S.cfg;if(me.role!=='admin'){back();return}
 $('app').innerHTML=`<div class="card"><div class="row">${backBtn()}<h2 class="grow" style="margin:0">Cài đặt</h2></div></div>
<div class="card users"><div class="row"><h3 class="grow" style="margin:0">Tài khoản</h3><button class="btn sm" id="uAdd">＋ Thêm tài khoản</button></div><div style="margin-top:8px">${c.users.map((u,i)=>`<div class="u"><span class="score n" style="flex-basis:36px;height:36px">${esc(u.name[0])}</span><div class="grow"><b>${esc(u.name)}</b>${u.u===me.u?' <span class="chip">Bạn</span>':''}<div class="muted">${esc(u.u)} · ${u.role==='admin'?'Quản trị':'Nhân viên'} · ${u.active===false?'<span style="color:var(--bad)">Đã khóa</span>':'Hoạt động'}</div></div><button class="tb" data-up="${i}">Đổi mật khẩu</button>${u.u!==me.u?`<button class="tb" data-ut="${i}">${u.active===false?'Mở':'Khóa'}</button><button class="tb" data-ud="${i}" style="color:var(--bad)">Xóa</button>`:''}</div>`).join('')}</div><p class="muted" style="margin-top:8px">Nhân viên: sửa xong phải chờ quản trị duyệt. Không vào được Cài đặt.</p></div>
<div class="card"><h3>Chìa khóa GitHub</h3><p class="muted">Đã mã hóa, không ai nhìn thấy. Khi chìa khóa hết hạn, dán chìa khóa mới vào đây.</p><button class="btn ghost sm" id="tokNew" style="margin-top:8px">Thay chìa khóa</button></div>
<div class="card"><h3>Mật khẩu mở trang khóa</h3><p class="muted">Trang khổ nhỏ hơn ${NARROW}px tự khóa. Chỉnh khóa từng trang: mở trang → nút “Khóa…”.</p><button class="btn ghost sm" id="lockNew" style="margin-top:8px">Đổi mật khẩu mở khóa</button></div>
<div class="card"><h3>Tên hiển thị trang web</h3><input id="sName" value="${esc(c.siteName||'')}"><button class="btn ghost sm" id="sNameSave" style="margin-top:8px">Lưu</button></div>`;
 $('uAdd').onclick=userSheet;$('app').querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>pwSheet(c.users[+b.dataset.up]));
 $('app').querySelectorAll('[data-ut]').forEach(b=>b.onclick=async()=>{const cc=JSON.parse(JSON.stringify(S.cfg));const u=cc.users[+b.dataset.ut];u.active=u.active===false;busy(true,'Đang lưu…');try{await saveCfg(cc,(u.active?'Mở khóa ':'Khóa ')+'tài khoản '+u.u);toast('Đã lưu');vSettings()}catch(e){toast(e.message,5000)}busy(false)});
 $('app').querySelectorAll('[data-ud]').forEach(b=>b.onclick=async()=>{const cc=JSON.parse(JSON.stringify(S.cfg));const u=cc.users[+b.dataset.ud];if(!(await ask('Xóa tài khoản '+u.name+'?','Xóa',true)))return;cc.users.splice(+b.dataset.ud,1);busy(true,'Đang lưu…');try{await saveCfg(cc,'Xóa tài khoản '+u.u);toast('Đã xóa');vSettings()}catch(e){toast(e.message,5000)}busy(false)});
 $('tokNew').onclick=async()=>{const t=await prompt2('Thay chìa khóa GitHub','Chìa khóa mới','password','Tạo ở github.com → Settings → Developer settings → Fine-grained tokens. Quyền Contents: Read and write cho repo này.');if(!t)return;busy(true,'Đang kiểm tra chìa khóa…');try{const info=await gh(RP(),{},t.trim());if(info.permissions&&!info.permissions.push)throw new Error('Chìa khóa chưa có quyền ghi.');const cc=JSON.parse(JSON.stringify(S.cfg));cc.token=await seal(await rawKey(S.K),enc.encode(t.trim()));S.token=t.trim();await saveCfg(cc,'Thay chìa khóa GitHub');sess.set(sessKey(),{u:me.u,K:b64(S.K),tok:S.token});toast('Đã thay chìa khóa')}catch(e){toast(e.message,5000)}busy(false)};
 $('lockNew').onclick=async()=>{const p=await prompt2('Đổi mật khẩu mở khóa','Mật khẩu mới (≥10 ký tự, có chữ và số)','password');if(p==null)return;if(!pwOk(p)){toast('Mật khẩu cần ít nhất 10 ký tự, có chữ và số.',4000);return}busy(true,'Đang lưu…');try{const cc=JSON.parse(JSON.stringify(S.cfg));const salt=crypto.getRandomValues(new Uint8Array(16));cc.lock={salt:b64(salt),...(await seal(await pwKey(p,salt),enc.encode('ok')))};await saveCfg(cc,'Đổi mật khẩu mở khóa');toast('Đã đổi')}catch(e){toast(e.message,5000)}busy(false)};
 $('sNameSave').onclick=async()=>{busy(true,'Đang lưu…');try{const cc=JSON.parse(JSON.stringify(S.cfg));cc.siteName=$('sName').value.trim();await saveCfg(cc,'Đổi tên hiển thị');header();toast('Đã lưu')}catch(e){toast(e.message,5000)}busy(false)}}
function userSheet(){sheet(`<h2>Thêm tài khoản</h2><label for="uN">Tên hiển thị</label><input id="uN"><label for="uU">Tên đăng nhập</label><input id="uU" autocapitalize="none" autocomplete="off"><label for="uP">Mật khẩu</label><input id="uP" type="password" autocomplete="new-password" placeholder="≥ 10 ký tự, có chữ và số"><label for="uR">Quyền</label><select id="uR"><option value="staff">Nhân viên – sửa xong chờ duyệt</option><option value="admin">Quản trị – lưu thẳng lên web</option></select><p class="err" id="uE"></p><div class="row"><button class="btn ghost grow" id="uC">Hủy</button><button class="btn grow" id="uS">Thêm</button></div>`);
 $('uC').onclick=closeSheet;$('uS').onclick=async()=>{const n=$('uN').value.trim(),u=$('uU').value.trim().toLowerCase(),p=$('uP').value;const er=m=>$('uE').textContent=m;if(!n||!u)return er('Nhập tên và tên đăng nhập.');if(!/^[a-z0-9._-]{3,30}$/.test(u))return er('Tên đăng nhập: chữ thường không dấu, số (3–30 ký tự).');if(S.cfg.users.some(x=>x.u===u))return er('Tên đăng nhập đã có.');if(!pwOk(p))return er('Mật khẩu cần ít nhất 10 ký tự, có chữ và số.');$('uS').disabled=true;try{const cc=JSON.parse(JSON.stringify(S.cfg));cc.users.push({u,name:n,role:$('uR').value,active:true,...(await wrapK(p,S.K))});await saveCfg(cc,'Thêm tài khoản '+u);closeSheet();toast('Đã thêm '+n+'. Gửi tên đăng nhập + mật khẩu cho họ.',4000);vSettings()}catch(e){er(e.message);$('uS').disabled=false}}}
function pwSheet(u){sheet(`<h2>Đổi mật khẩu – ${esc(u.name)}</h2><label for="wP">Mật khẩu mới</label><input id="wP" type="password" autocomplete="new-password" placeholder="≥ 10 ký tự, có chữ và số"><label for="wP2">Nhập lại</label><input id="wP2" type="password" autocomplete="new-password"><p class="err" id="wE"></p><div class="row"><button class="btn ghost grow" id="wC">Hủy</button><button class="btn grow" id="wS">Lưu</button></div>`);
 $('wC').onclick=closeSheet;$('wS').onclick=async()=>{const p=$('wP').value;if(!pwOk(p))return $('wE').textContent='Mật khẩu cần ít nhất 10 ký tự, có chữ và số.';if(p!==$('wP2').value)return $('wE').textContent='Hai lần nhập không khớp.';$('wS').disabled=true;try{const cc=JSON.parse(JSON.stringify(S.cfg));const x=cc.users.find(y=>y.u===u.u);Object.assign(x,await wrapK(p,S.K));await saveCfg(cc,'Đổi mật khẩu '+u.u);closeSheet();toast('Đã đổi mật khẩu');if(S.view==='settings')vSettings()}catch(e){$('wE').textContent=e.message;$('wS').disabled=false}}}

boot();
</script>
</body>
</html>
