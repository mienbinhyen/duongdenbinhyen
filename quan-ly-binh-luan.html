<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Quản lý Like & Bình luận - PACOBOOKS</title>
<style>
  body { margin: 0; background: #f5f7f6; font-family: Arial, sans-serif; color: #333; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; color: #019570; margin: 8px 0 16px; }
  .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .tabs button { border: 1px solid #019570; background: #fff; color: #019570; border-radius: 20px; padding: 8px 16px; margin: 0 6px 12px 0; cursor: pointer; font-size: 15px; }
  .tabs button.on { background: #019570; color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eee; vertical-align: top; }
  th { cursor: pointer; white-space: nowrap; background: #fafafa; }
  td.n { text-align: right; white-space: nowrap; }
  a { color: #019570; text-decoration: none; word-break: break-all; }
  .sum { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .sum div { background: #eef8f4; border-radius: 8px; padding: 10px 14px; font-size: 14px; } .sum b { font-size: 20px; display: block; color: #019570; }
  .cm { border-bottom: 1px solid #eee; padding: 10px 0; }
  .cm small { color: #888; } .cm p { margin: 6px 0; white-space: pre-wrap; word-break: break-word; }
  .st-hien { color: #019570; } .st-an { color: #d33; }
  .cm button { border: 1px solid #ccc; background: #fff; border-radius: 6px; padding: 5px 12px; margin-right: 6px; cursor: pointer; }
  .tool { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .tool input, .tool select { padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
  #login input { padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; width: 220px; }
  #login button, .btn { background: #019570; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; font-size: 15px; }
  .hide { display: none; } .muted { color: #999; }
  .rep { margin: 4px 0 8px 16px; padding: 6px 10px; border-left: 3px solid #019570; background: #f3faf7; border-radius: 4px; white-space: pre-wrap; }
  .rf textarea { width: 100%; box-sizing: border-box; min-height: 70px; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font: inherit; margin: 6px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Quản lý Like, Bình luận & Lượt xem</h1>

  <div class="card" id="login">
    <p>Nhập mật khẩu quản lý:</p>
    <form id="lf"><input type="password" id="pw" autocomplete="current-password"> <button>Vào</button> <span id="lerr" style="color:#d33"></span></form>
  </div>

  <div id="app" class="hide">
    <div class="sum" id="sum"></div>
    <div class="tabs"><button data-t="trang" class="on">Theo trang</button><button data-t="bl">Bình luận</button> <button class="btn" id="reload" style="float:right">Tải lại</button></div>

    <div class="card" id="t-trang">
      <div class="tool"><input id="q1" placeholder="Tìm trang..."></div>
      <table><thead><tr><th data-k="p">Trang</th><th data-k="xem">Lượt xem ▼</th><th data-k="tt">Thích trang</th><th data-k="like">Thích bài</th><th data-k="bl">Bình luận</th></tr></thead><tbody id="tb"></tbody></table>
    </div>

    <div class="card hide" id="t-bl">
      <div class="tool"><input id="q2" placeholder="Tìm tên, nội dung, trang...">
        <select id="f2"><option value="">Tất cả</option><option value="hien">Đang hiện</option><option value="an">Đã ẩn</option></select></div>
      <div id="cl"></div>
    </div>
  </div>
</div>

<script>
/* Dán link Apps Script (/exec) vào đây */
var API = 'https://script.google.com/macros/s/AKfycbzUlNC6AVsUBBYWqX3C81rf0N9Xi-VISGLrdO7Vy3naMSYY7jPc5vli4WqgsY8IvfWq/exec';
var SITE = 'https://duongdenbinhyen.com';
(function () {
  var K = '', DATA = { pages: [], list: [] }, sortK = 'xem', sortD = -1;
  function $(s) { return document.querySelector(s); }
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function post(o) { return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(o) }).then(function (r) { return r.json(); }); }
  function link(p) { return '<a href="' + SITE + esc(p) + '" target="_blank" rel="noopener">' + esc(p === '/' ? '/ (Trang chủ)' : p) + '</a>'; }

  function load(o) {
    $('#reload').disabled = true;
    return post(o || { a: 'admin', k: K }).then(function (r) {
      $('#reload').disabled = false;
      if (!r || !r.ok) { $('#app').classList.add('hide'); $('#login').classList.remove('hide'); $('#lerr').textContent = 'Sai mật khẩu.'; try { sessionStorage.removeItem('pacoQL'); } catch (e) {} return; }
      try { sessionStorage.setItem('pacoQL', K); } catch (e) {}
      $('#login').classList.add('hide'); $('#app').classList.remove('hide');
      DATA = r; draw();
    }).catch(function () { $('#reload').disabled = false; $('#lerr').textContent = 'Lỗi kết nối.'; });
  }

  function draw() {
    var P = DATA.pages || [], L = DATA.list || [];
    var tx = 0, tl = 0, tt = 0; P.forEach(function (x) { tx += x.xem; tl += x.like; tt += (x.tt || 0); });
    $('#sum').innerHTML = '<div><b>' + tx + '</b>Lượt xem</div><div><b>' + tt + '</b>Thích trang</div><div><b>' + tl + '</b>Thích bài</div><div><b>' + (L.length + L.filter(function (c) { return c.r; }).length) + '</b>Bình luận</div><div><b>' + P.length + '</b>Trang có dữ liệu</div>';
    var q = $('#q1').value.toLowerCase();
    var rows = P.filter(function (x) { return !q || x.p.toLowerCase().indexOf(q) >= 0; })
      .sort(function (a, b) { return sortK === 'p' ? sortD * a.p.localeCompare(b.p) : sortD * (a[sortK] - b[sortK]); });
    $('#tb').innerHTML = rows.map(function (x) { return '<tr><td>' + link(x.p) + '</td><td class="n">' + x.xem + '</td><td class="n">' + (x.tt || 0) + '</td><td class="n">' + x.like + '</td><td class="n">' + x.bl + '</td></tr>'; }).join('') || '<tr><td colspan="5" class="muted">Chưa có dữ liệu.</td></tr>';
    var q2 = $('#q2').value.toLowerCase(), f2 = $('#f2').value, nm = { hien: 'Đang hiện', an: 'Đã ẩn', cho: 'Chờ duyệt' };
    $('#cl').innerHTML = L.filter(function (c) { return (!f2 || c.st === f2) && (!q2 || (c.n + ' ' + c.t + ' ' + c.p).toLowerCase().indexOf(q2) >= 0); }).map(function (c) {
      var u = SITE + esc(c.p.split('#')[0]) + '#bl-' + esc(c.id);
      return '<div class="cm"><small>' + esc(c.d) + ' · <a href="' + u + '" target="_blank" rel="noopener">' + esc(c.p === '/' ? '/ (Trang chủ)' : c.p) + '</a> · <b class="st-' + esc(c.st) + '">' + esc(nm[c.st] || c.st) + '</b></small>' +
        '<p><b>' + esc(c.n) + ':</b> ' + esc(c.t) + '</p>' +
        (c.r ? '<div class="rep"><b>PACOBOOKS trả lời:</b> ' + esc(c.r) + '</div>' : '') +
        '<button data-rep="' + esc(c.id) + '">' + (c.r ? 'Sửa trả lời' : 'Trả lời') + '</button>' +
        (c.st === 'hien' ? '<button data-id="' + esc(c.id) + '" data-st="an">Ẩn</button>' : '<button data-id="' + esc(c.id) + '" data-st="hien">Hiện</button>') +
        '<button data-id="' + esc(c.id) + '" data-st="xoa">Xóa</button></div>';
    }).join('') || '<p class="muted">Chưa có bình luận.</p>';
  }

  $('#lf').onsubmit = function (e) { e.preventDefault(); K = $('#pw').value; $('#lerr').textContent = 'Đang vào...'; load(); };
  $('#reload').onclick = function () { load(); };
  $('#q1').oninput = draw; $('#q2').oninput = draw; $('#f2').onchange = draw;
  document.querySelectorAll('th[data-k]').forEach(function (th) {
    th.onclick = function () { var k = th.dataset.k; sortD = sortK === k ? -sortD : -1; sortK = k;
      document.querySelectorAll('th[data-k]').forEach(function (t) { t.textContent = t.textContent.replace(/ [▲▼]$/, ''); });
      th.textContent += sortD < 0 ? ' ▼' : ' ▲'; draw(); };
  });
  document.querySelectorAll('.tabs button[data-t]').forEach(function (b) {
    b.onclick = function () { document.querySelectorAll('.tabs button[data-t]').forEach(function (x) { x.classList.toggle('on', x === b); });
      $('#t-trang').classList.toggle('hide', b.dataset.t !== 'trang'); $('#t-bl').classList.toggle('hide', b.dataset.t !== 'bl'); };
  });
  $('#cl').onclick = function (e) {
    var t = e.target;
    if (t.dataset.rep) {   /* mở ô trả lời ngay dưới bình luận */
      var cm = t.closest('.cm'), old = cm.querySelector('.rf'); if (old) { old.remove(); return; }
      var c = (DATA.list || []).filter(function (x) { return x.id === t.dataset.rep; })[0] || {};
      cm.insertAdjacentHTML('beforeend', '<div class="rf"><textarea placeholder="Nội dung trả lời (để trống rồi gửi = xóa câu trả lời)">' + esc(c.r || '') + '</textarea><button class="btn" data-send="' + esc(t.dataset.rep) + '">Gửi trả lời</button></div>');
      cm.querySelector('.rf textarea').focus(); return;
    }
    if (t.dataset.send) {
      var tx = t.closest('.rf').querySelector('textarea').value;
      $('#cl').style.opacity = .5; load({ a: 'rep', k: K, id: t.dataset.send, t: tx }).then(function () { $('#cl').style.opacity = 1; });
      return;
    }
    if (!t.dataset.id) return;
    if (t.dataset.st === 'xoa' && !confirm('Xóa hẳn bình luận này?')) return;
    $('#cl').style.opacity = .5; load({ a: 'mod', k: K, id: t.dataset.id, st: t.dataset.st }).then(function () { $('#cl').style.opacity = 1; });
  };
  try { K = sessionStorage.getItem('pacoQL') || ''; } catch (e) {}
  if (K) load();
})();
</script>
</body>
</html>
