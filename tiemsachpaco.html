<script>
    // Slider script
    const track = document.getElementById('sliderTrack');
    let index = 0;
    setInterval(() => { index = (index + 1) % 3; track.style.transform = `translateX(-${index * 100}%)`; }, 3000);

    // Form script gửi về Google Sheet của Ông Paco
    const pacoForm = document.getElementById('pacoForm');
    pacoForm.addEventListener('submit', e => {
        e.preventDefault();
        document.getElementById('submitBtn').innerHTML = "Đang gửi...";
        fetch("https://script.google.com/macros/s/AKfycbzYGjzAdP4RLsO7uVT85TLPoJtNxDPBBAAXvpmY5WvwETiRFUekWzYsW7R6wS1z7UOx/exec", {
            method: 'POST', mode: 'no-cors', body: new FormData(pacoForm)
        }).then(() => {
            document.getElementById('msg').classList.remove('hidden');
            pacoForm.reset();
            document.getElementById('submitBtn').innerHTML = "HOÀN TẤT ĐẶT HÀNG";
        });
    });
</script>
