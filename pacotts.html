
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chuyển Văn Bản Thành Giọng Nói Paco</title>
  <style>
    html, body { margin: 0; padding: 0; font-family: Arial, sans-serif; background: #fff; }
    .paco-wrapper { max-width: 100%; padding: 20px 5%; box-sizing: border-box; }
    .paco-header { text-align: center; margin-bottom: 20px; }
    .paco-header h1 {
      font-size: 28px;
      margin-bottom: 5px;
      color: rgba(0, 51, 153, 0.9); /* xanh dương đậm 40% đen */
    }
    .paco-logo { width: 100px; height: auto; margin-bottom: 5px; }
    .paco-quote {
      font-style: italic;
      font-size: 15px;
      color: rgba(0, 100, 0, 0.8); /* xanh lá 20% đen */
    }
    .paco-box {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      background: #fdfdfd;
    }
    .paco-row-flex { display: flex; gap: 20px; flex-wrap: wrap; }
    .paco-half { flex: 1; min-width: 250px; }
    .paco-box textarea, .paco-box select, .paco-box input[type="text"] {
      width: 100%; padding: 10px; font-size: 16px; margin-bottom: 10px; box-sizing: border-box;
    }
    .paco-button-row { display: flex; gap: 10px; margin-top: 10px; }
    .paco-button {
      flex: 1; font-size: 16px; padding: 12px; border-radius: 5px; cursor: pointer;
      border: none; color: white; transition: all 0.1s ease-in-out;
    }
    .paco-button:active { transform: scale(0.97); box-shadow: inset 0 3px 5px rgba(0,0,0,0.2); }
    .paco-btn-green { background: #2e7d32; }
    .paco-btn-black { background: #000; }
    .paco-info { font-size: 14px; color: #666; margin-bottom: 10px; }
    .paco-history-box { border: 1px solid #ccc; padding: 15px; border-radius: 8px; background: #f9f9f9; }
    .paco-history-item { margin-bottom: 10px; padding: 8px; border-radius: 5px; background: #fff; border: 1px solid #ddd; }
  </style>
</head>
<body>
  <div class="paco-wrapper">
    <div class="paco-header">
      <h1>CHUYỂN VĂN BẢN THÀNH GIỌNG NÓI PACO</h1>
      <img class="paco-logo" src="logo_paco.png" alt="Logo Paco">
      <div class="paco-quote">
        “Đừng chờ đợi một điều kỳ diệu, bởi chính bạn là điều kỳ diệu lớn nhất mà cuộc đời ban tặng” – Tác giả Thiện Nhân
      </div>
    </div>

    <div class="paco-box">
      <div class="paco-row-flex">
        <div class="paco-half">
          <label><strong>Tên bài viết:</strong></label>
          <input type="text" id="titleInput" placeholder="Nhập tên bài để làm tên file...">
        </div>
        <div class="paco-half">
          <label><strong>Chọn giọng đọc:</strong></label>
          <select id="voiceSelect">
            <option value="onyx">Onyx – Trầm cảm xúc</option>
            <option value="echo">Echo – Nhẹ nhàng</option>
            <option value="alloy">Alloy – Trung tính</option>
            <option value="nova">Nova – Rõ ràng</option>
            <option value="shimmer">Shimmer – Tươi tắn</option>
          </select>
        </div>
      </div>

      <textarea id="textInput" rows="8" placeholder="Nhập nội dung bài viết... (tối đa 5000 từ)"></textarea>
      <div class="paco-info" id="charInfo">0 từ | 0 ký tự (Tối đa: 5000 từ)</div>

      <div class="paco-button-row">
        <button onclick="previewVoice()" class="paco-button paco-btn-green">🔊 NGHE THỬ (≤ 100 TỪ)</button>
        <button onclick="generateVoice()" class="paco-button paco-btn-black">🧠 TẠO GIỌNG NÓI</button>
      </div>
    </div>

    <audio id="audioPlayer" controls style="width: 100%; display: none;"></audio>

    <div class="paco-box paco-history-box" id="historyList">
      <h4>Lịch sử tạo giọng:</h4>
    </div>
  </div>

<script>
  const apiKey = "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";
  const textInput = document.getElementById("textInput");
  const titleInput = document.getElementById("titleInput");
  const voiceSelect = document.getElementById("voiceSelect");
  const charInfo = document.getElementById("charInfo");
  const audioPlayer = document.getElementById("audioPlayer");
  const historyList = document.getElementById("historyList");

  textInput.addEventListener("input", () => {
    const text = textInput.value;
    const words = text.trim().split(/\s+/).filter(Boolean);
    charInfo.textContent = `${words.length} từ | ${text.length} ký tự (Tối đa: 5000 từ)`;
  });

  async function previewVoice() {
    let selected = window.getSelection().toString().trim();
    if (!selected) {
      const words = textInput.value.trim().split(/\s+/).slice(0, 100);
      selected = words.join(" ");
    }
    if (!selected) return;
    try {
      const audioBlob = await fetchVoiceFromAPI(selected, voiceSelect.value);
      playAudio(audioBlob);
    } catch (e) {
      alert("Lỗi khi gọi API nghe thử.");
    }
  }

  async function generateVoice() {
    const inputText = textInput.value.trim();
    const voice = voiceSelect.value;
    const title = titleInput.value.trim().replace(/\s+/g, '_') || 'voice_output';
    if (!inputText) return;
    try {
      const audioBlob = await fetchVoiceFromAPI(inputText, voice);
      const filename = `${title}_${Date.now()}.mp3`;
      addToHistory(audioBlob, filename);
      playAudio(audioBlob);
    } catch (e) {
      alert("Lỗi khi gọi API tạo giọng nói.");
    }
  }

  async function fetchVoiceFromAPI(text, voice) {
    const response = await fetch("https://api.openai.com/v1/audio/speech", {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${apiKey}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ model: "tts-1", input: text, voice: voice, response_format: "mp3" })
    });
    if (!response.ok) { console.error(await response.text()); throw new Error("API Error"); }
    return await response.blob();
  }

  function playAudio(blob) {
    const url = URL.createObjectURL(blob);
    audioPlayer.src = url;
    audioPlayer.style.display = "block";
    audioPlayer.play();
  }

  function addToHistory(blob, filename) {
    const url = URL.createObjectURL(blob);
    const div = document.createElement("div");
    div.className = "paco-history-item";
    div.innerHTML = `<a href="${url}" download="${filename}">⬇️ ${filename}</a><br><audio controls src="${url}" style="width:100%;"></audio>`;
    historyList.appendChild(div);
  }
</script>
</body>
</html>
